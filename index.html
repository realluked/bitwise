(--reg-bg)}.avatar,.brank{flex:none;font-family:var(--f-display);font-weight:700}.brank{width:26px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted)}.brow.m1 .brank{color:var(--gold)}.brow.m2 .brank{color:var(--mem)}.brow.m3 .brank{color:var(--alu)}.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff}.bname{flex:1;min-width:0;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bname small{font-weight:600;color:var(--muted)}.blv{display:block;font-size:12px}.bxp{flex:none;font-family:var(--f-display);font-weight:600;font-variant-numeric:tabular-nums}@media (max-width:380px){.navbtn{font-size:11px}.quick{gap:6px}.clab{font-size:10px}}:root{padding-top:env(safe-area-inset-top,0)}</style></head><body><div id="app"></div><script>window.BITWISE_CONFIG={url:"https://bzcaswhwxffuuhrqtdyk.supabase.co",key:"sb_publishable_NaAvMjYFrs0Z0StUaIJzug_1z-4n-H3"};</script><script>!function(){const e=(...e)=>e.join("\n"),t=["The address in the PC is copied to the MAR","The PC is incremented by 1","The instruction at that address is fetched from memory into the MDR","The instruction in the MDR is copied to the CIR"],s=["The PC holds the address of the next instruction","The address in the PC is copied to the MAR","The PC is incremented by 1","The instruction is fetched from memory into the MDR","The instruction in the MDR is copied to the CIR","The CU decodes the instruction in the CIR","The instruction is executed"],a=["The browser asks to connect to a secure web server","The browser asks the server to identify itself","The server sends a copy of its digital certificate","The browser checks that the certificate is authentic","The browser sends a message back to the server","The server sends a digital acknowledgement to start an encrypted session","Encrypted data is shared between the browser and the server"],n=["Managing files","Handling interrupts","Providing an interface","Managing peripherals and drivers","Managing memory","Managing multitasking","Providing a platform for running applications","Providing system security","Managing user accounts"],o=["A device or program sends an interrupt signal to the processor","The processor checks for interrupts at the end of each fetch-decode-execute cycle","The current task is paused and its state is saved","The interrupt service routine (ISR) handles the interrupt","The saved task is restored and carries on"],r={L1:{name:"The registers",ex:[{type:"teach",title:"Registers",text:"Inside the CPU are registers: tiny, very fast stores. For Paper 1 you need five of them.",hi:["PC","MAR","MDR","CIR","ACC"]},{type:"teach",title:"PC and MAR",text:"PC (Program Counter) holds the address of the next instruction to be fetched. MAR (Memory Address Register) holds the address of the memory location being read from or written to.",hi:["PC","MAR"]},{type:"teach",title:"MDR, CIR and ACC",text:"MDR (Memory Data Register) holds the data or instruction fetched from memory. CIR (Current Instruction Register) holds the instruction being decoded and executed. ACC (Accumulator) holds the results of calculations.",hi:["MDR","CIR","ACC"]},{type:"mc",q:"What does the PC hold?",options:["The address of the next instruction","The instruction being decoded","The result of a calculation","Data fetched from memory"],a:0,why:"PC = Program Counter. It always points to the next instruction."},{type:"type",q:"What does MAR stand for?",a:["memory address register"],why:"MAR holds an address, never the data itself."},{type:"match",q:"Match each register to its job",pairs:[["PC","Address of the next instruction"],["MAR","Address being read from or written to"],["MDR","Data or instruction fetched from memory"],["CIR","Instruction being decoded"],["ACC","Result of a calculation"]]},{type:"tap",q:"Tap the register that holds the instruction currently being decoded.",a:"CIR",why:"CIR = Current Instruction Register."},{type:"mc",q:"Which register holds the data that has just been fetched from memory?",options:["MDR","MAR","PC","CIR"],a:0,why:"Memory DATA Register. The MAR only holds the address."},{type:"type",q:"What does CIR stand for?",a:["current instruction register"],why:"It holds the instruction the CPU is working on right now."},{type:"tap",q:"Tap the register that stores the results of calculations.",a:"ACC",why:"The accumulator holds results from the ALU."}]},L2:{name:"CU, ALU and memory",ex:[{type:"teach",title:"Control unit (CU)",text:"The CU decodes the instruction in the CIR and sends control signals to the other components so the instruction is carried out. It is kept in time by the clock.",hi:["CU","CIR"]},{type:"teach",title:"Arithmetic logic unit (ALU)",text:"The ALU carries out calculations (add, subtract) and logic operations (AND, OR, comparisons). Its results go into the ACC.",hi:["ALU","ACC"]},{type:"teach",title:"Memory (RAM)",text:"Memory is outside the CPU. Programs and data are stored there, each at its own address. The CPU fetches instructions from it one at a time.",hi:["RAM"]},{type:"mc",q:"Which component decodes the instruction?",options:["The control unit (CU)","The ALU","The MAR","The accumulator"],a:0,why:'In the exam, write "the control unit". "The CPU" alone scores 0.'},{type:"tap",q:"Tap the component that performs arithmetic and logic operations.",a:"ALU",why:"Arithmetic Logic Unit."},{type:"mc",q:"Where are a program's instructions stored before they are fetched?",options:["Memory (RAM)","The CIR","The control unit","The ALU"],a:0,why:"Instructions wait in memory until they are fetched."},{type:"blank",q:"The ___ carries out calculations and the result is stored in the ___.",a:["ALU","ACC"],bank:["ALU","ACC","CU","MDR"],why:"ALU does the maths, ACC holds the answer."},{type:"type",q:"What does ALU stand for?",a:["arithmetic logic unit","arithmetic and logic unit","arithmetic logical unit","arithmetic and logical unit"],why:"It does the arithmetic and the logic."},{type:"match",q:"Match each part to its job",pairs:[["CU","Decodes and sends control signals"],["ALU","Does arithmetic and logic"],["RAM","Stores instructions and data"],["ACC","Holds results from the ALU"]]}]},L3:{name:"Fetch, step by step",ex:[{type:"teach",title:"Fetch 1",text:"The PC holds the address of the next instruction.",hi:["PC"],flow:["PC"]},{type:"teach",title:"Fetch 2",text:"The address in the PC is copied to the MAR.",flow:["PC","MAR"]},{type:"teach",title:"Fetch 3",text:"The PC is incremented by 1, so it now points to the next instruction.",flow:["PC"],extra:"PC + 1"},{type:"teach",title:"Fetch 4",text:"The address in the MAR goes along the address bus to memory. The instruction at that address is sent back along the data bus into the MDR.",flow:["MAR","ABUS","RAM","DBUS","MDR"]},{type:"teach",title:"Fetch 5",text:"The instruction in the MDR is copied to the CIR.",flow:["MDR","CIR"],mnemo:!0},{type:"blank",q:"The address in the ___ is copied to the ___.",a:["PC","MAR"],bank:["PC","MAR","MDR","CIR","ACC"],why:"First move of every fetch: PC to MAR."},{type:"mc",q:"What happens to the PC straight after its address is copied to the MAR?",options:["It is incremented by 1","It is reset to 0","It is copied to the MDR","It is decoded"],a:0,why:"Incrementing makes the PC point at the next instruction."},{type:"order",q:"Put the fetch stage in order",items:t,why:"Remember PC, MAR, MDR, CIR. Cambridge accepts the increment any time after the PC is copied to the MAR, but this order is safest."},{type:"tap",q:"When the instruction arrives from memory, which register does it go into first?",a:"MDR",why:"Memory to MDR, then MDR to CIR."},{type:"blank",q:"The instruction in the ___ is copied to the ___.",a:["MDR","CIR"],bank:["MDR","CIR","MAR","PC","CU"],why:"Last step of fetch."}]},L4:{name:"Fetch drills",ex:[{type:"teach",title:"Quick recap",text:"Fetch moves through PC, MAR, MDR, CIR, with the PC incremented on the way.",flow:["PC","MAR","MDR","CIR"],mnemo:!0},{type:"tap",q:"Tap the register that the PC's address is copied into.",a:"MAR",why:"PC to MAR."},{type:"order",q:"Put the whole fetch stage in order",items:["The PC holds the address of the next instruction"].concat(t),why:"PC, MAR, increment, MDR, CIR."},{type:"mc",q:"Why is the PC incremented?",options:["So it points to the next instruction","To count how many instructions have run","To clear it for the next calculation","To store the result of the instruction"],a:0,why:"The PC always holds the address of the next instruction."},{type:"blank",q:"The PC is ___ so it holds the address of the ___ instruction.",a:["incremented","next"],bank:["incremented","decoded","next","current","copied"],why:"Incremented by 1, pointing at the next one."},{type:"tap",q:"After the MDR, where does the instruction go?",a:"CIR",why:"MDR to CIR. Then it is decoded."},{type:"order",q:"Order the registers used in fetch",items:["PC","MAR","MDR","CIR"],short:!0,why:"Pick Me My Coffee: PC, MAR, MDR, CIR."},{type:"mc",q:'A student writes: "The instruction is sent to the CPU." Why does this lose the mark?',options:["It doesn't name the register (MDR or CIR)",'It uses the word "instruction"',"The instruction goes to the ALU instead","Instructions are never sent anywhere"],a:0,why:"Examiners want the exact register. Name the MDR and the CIR."}]},L5:{name:"Decode and execute",ex:[{type:"teach",title:"Decode",text:'The instruction in the CIR is decoded by the control unit. Always write "control unit", never just "the CPU".',flow:["CIR","CU"]},{type:"teach",title:"Execute",text:"The CU sends control signals so the instruction is carried out. If it needs a calculation, the ALU does it and the result is stored in the ACC. Then the cycle repeats with the next instruction.",flow:["CU","ALU","ACC"]},{type:"mc",q:"Which component decodes the instruction?",options:["The control unit","The CPU","The MDR","The ALU"],a:0,why:'One of the most commonly lost marks. Write "control unit", not "the CPU".'},{type:"tap",q:"Tap the component that decodes the instruction.",a:"CU",why:"Control Unit."},{type:"blank",q:"The instruction in the ___ is decoded by the ___.",a:["CIR","CU"],bank:["CIR","CU","MDR","ALU","CPU"],why:"CIR is decoded by the CU."},{type:"mc",q:"During execute, where is the result of a calculation stored?",options:["The accumulator (ACC)","The MAR","The PC","The CIR"],a:0,why:"ALU calculates, ACC stores."},{type:"order",q:"Put decode and execute in order",items:["The CU decodes the instruction in the CIR","The CU sends control signals","The ALU carries out the calculation","The result is stored in the ACC"],why:"Decode, signals, calculate, store."},{type:"mc",q:"What happens after the instruction is executed?",options:["The cycle repeats with the next instruction","The CPU switches off","Memory is cleared","The PC is reset to 0"],a:0,why:"The PC already holds the next address, so fetch starts again."}]},L6:{name:"The three buses",ex:[{type:"teach",title:"Address bus",text:"Carries addresses from the CPU (the MAR) to memory. It is one-way (unidirectional).",hi:["ABUS","MAR","RAM"]},{type:"teach",title:"Data bus",text:"Carries data and instructions between memory and the CPU (the MDR). It is two-way (bidirectional).",hi:["DBUS","MDR","RAM"]},{type:"teach",title:"Control bus",text:"Carries control signals from the CU, such as read, write and clock signals. It is two-way.",hi:["CBUS","CU"]},{type:"match",q:"Match each bus to what it carries",pairs:[["Address bus","Addresses, one-way"],["Data bus","Data and instructions, two-way"],["Control bus","Read, write and clock signals"]]},{type:"mc",q:"Which bus is unidirectional?",options:["Address bus","Data bus","Control bus","All of them"],a:0,why:"Addresses only ever go from the CPU to memory."},{type:"tap",q:"Tap the bus that carries the instruction from memory to the MDR.",a:"DBUS",why:"Instructions and data travel on the data bus."},{type:"mc",q:"During fetch, what is sent on the control bus?",options:["A read signal","The instruction","The address","The result"],a:0,why:"The CU tells memory to read the location in the MAR."},{type:"blank",q:"The address bus is ___ but the data bus is ___.",a:["one-way","two-way"],bank:["one-way","two-way","faster","slower"],why:"Unidirectional vs bidirectional."}]},L7:{name:"The full cycle",ex:[{type:"teach",title:"A full-mark answer",text:'If a question says "Describe the fetch-decode-execute cycle", these are the marking points:',list:s},{type:"order",q:"Put the full cycle in order",items:s,why:"Fetch is the first five steps, then decode, then execute."},{type:"blank",q:"The address in the ___ is copied to the ___. The ___ is incremented. The instruction is fetched into the ___, then copied to the ___. The ___ decodes it.",a:["PC","MAR","PC","MDR","CIR","CU"],bank:["PC","MAR","PC","MDR","CIR","CU","ALU","ACC"],why:"PC, MAR, PC + 1, MDR, CIR, CU."},{type:"type",q:"Which register holds the address of the next instruction? (abbreviation is fine)",a:["pc","program counter"],why:"Program Counter."},{type:"tap",q:"Tap where the address goes on its way to memory.",a:"ABUS",why:"MAR to memory along the address bus."},{type:"order",q:"Order the parts an instruction passes through",items:["RAM","MDR","CIR","CU"],short:!0,why:"From memory to MDR, to CIR, decoded by the CU."},{type:"mc",q:"Which part of the cycle does the CU carry out?",options:["Decode","Increment the PC","Store results","Hold the next address"],a:0,why:"CU decodes and then sends the signals to execute."}]},L8:{name:"FDE exam traps",ex:[{type:"mc",q:'"Which component decodes the instruction?" Which answer gets the mark?',options:["The control unit","The CPU","The processor","The computer"],a:0,why:"Name the component inside the CPU."},{type:"mc",q:"What does the MAR hold?",options:["The address of the memory location being read from or written to","The data being read from memory","The next instruction","The result of the last calculation"],a:0,why:"Common mix-up. MAR = address, MDR = data."},{type:"mc",q:'Best answer for "State the purpose of the accumulator"?',options:["It stores the results of calculations carried out by the ALU","It accumulates data","It stores instructions","It counts the instructions"],a:0,why:"Say what it stores and where the result came from."},{type:"type",q:"What does MDR stand for?",a:["memory data register"],why:"Holds data or instructions coming from or going to memory."},{type:"mc",q:'A student writes "The PC holds the next instruction." What\'s wrong?',options:["The PC holds the ADDRESS of the next instruction","Nothing, it's correct","The PC holds the current instruction","The PC holds the result"],a:0,why:'The word "address" is the mark.'},{type:"tap",q:"Tap the register a fetched instruction is copied into before it is decoded.",a:"CIR",why:"MDR to CIR, then the CU decodes it."},{type:"order",q:"One more time: the fetch stage",items:t,why:"PC, MAR, increment, MDR, CIR."},{type:"blank",q:"The ___ bus is one-way and carries addresses from the ___ to memory.",a:["address","MAR"],bank:["address","data","MAR","MDR","control"],why:"Address bus, from the MAR."}]},E1:{name:"Symmetric and asymmetric",ex:[{type:"teach",title:"Why encrypt?",text:"Encryption scrambles data so that, if it is intercepted, it cannot be understood. It does not stop the data being intercepted."},{type:"teach",title:"Plaintext and ciphertext",text:"Plaintext is the original, readable data. An encryption algorithm and a key turn it into ciphertext, which cannot be read without the key."},{type:"teach",title:"Symmetric encryption",text:"The same key is used to encrypt and to decrypt. The key has to be sent to the receiver, so it could be intercepted on the way."},{type:"teach",title:"Asymmetric encryption",text:"Uses a pair of keys. The receiver's public key, which anyone can have, encrypts the data. Only the receiver's private key, which is never shared, can decrypt it."},{type:"mc",q:"Does encryption stop data being intercepted?",options:["No, it makes intercepted data meaningless","Yes, it blocks hackers from the network","Yes, it hides the data from routers","No, it only compresses the data"],a:0,why:"Classic exam trap. Say it makes the data meaningless if intercepted."},{type:"match",q:"Match each term to its meaning",pairs:[["Plaintext","Original readable data"],["Ciphertext","Scrambled, unreadable data"],["Public key","Shared with anyone, used to encrypt"],["Private key","Kept secret, used to decrypt"]]},{type:"mc",q:"Sam sends Alex a message using asymmetric encryption. Which key encrypts it?",options:["Alex's public key","Alex's private key","Sam's private key","A key they both share"],a:0,why:"Encrypt with the receiver's public key."},{type:"mc",q:"Which key decrypts Sam's message?",options:["Alex's private key","Alex's public key","Sam's public key","The key that encrypted it"],a:0,why:"Only the receiver's private key can decrypt it."},{type:"mc",q:"What is the main weakness of symmetric encryption?",options:["The key has to be shared, so it could be intercepted","It needs two different keys","It cannot encrypt text","It cannot be decrypted"],a:0,why:"Anyone who intercepts the key can decrypt the data."},{type:"blank",q:"Symmetric encryption uses the ___ key to encrypt and decrypt. Asymmetric encryption encrypts with a ___ key and decrypts with a ___ key.",a:["same","public","private"],bank:["same","public","private","different","master"],why:"Same key vs public and private key pair."}]},S1:{name:"The SSL handshake",ex:[{type:"teach",title:"SSL and TLS",text:"SSL (Secure Socket Layer) and TLS (Transport Layer Security) encrypt the data sent between a web browser and a web server. A site using them shows https and a padlock."},{type:"teach",title:"The handshake",text:"Learn these as arrows between the browser and the server. In a diagram question every arrow needs a label.",list:a},{type:"order",q:"Put the start of the handshake in order",items:a.slice(0,4),why:"Connect, ask for ID, certificate sent, certificate checked."},{type:"mc",q:"What does the server send to prove who it is?",options:["Its digital certificate","Its private key","Its IP address only","A password"],a:0,why:"The digital (SSL) certificate proves the server's identity."},{type:"mc",q:"What does the browser check about the certificate?",options:["That it is authentic and from a trusted certificate authority","That the website has been updated recently","That the server is in the same country","That the server has a firewall"],a:0,why:"Authentic and issued by a trusted CA."},{type:"order",q:"Put the end of the handshake in order",items:a.slice(3),why:"Checked, message back, acknowledgement, encrypted data."},{type:"mc",q:"How can a user tell a website uses SSL or TLS?",options:["The address starts with https and there is a padlock","The page loads faster","The address ends in .com","The site asks for a password"],a:0,why:"https plus the padlock."},{type:"type",q:"What does SSL stand for?",a:["secure socket layer","secure sockets layer"],why:"Secure Socket Layer. TLS (Transport Layer Security) is its newer version."}]},S2:{name:"Certificates and exam drill",ex:[{type:"teach",title:"Digital certificates",text:"A digital certificate proves a website is who it says it is. It is issued by a certificate authority (CA) and contains:",bullets:["The organisation name","The domain name","The name of the certificate authority","A serial number","An expiry date","The server's public key","The CA's digital signature"]},{type:"mc",q:"Who issues digital certificates?",options:["A certificate authority (CA)","The web browser","The user's internet provider","The operating system"],a:0,why:"A trusted CA issues and signs them."},{type:"mc",q:"Which of these is NOT in a digital certificate?",options:["The user's password","The expiry date","The server's public key","The name of the certificate authority"],a:0,why:"Certificates hold no user passwords."},{type:"order",q:"Put the whole SSL handshake in order",items:a,why:"Seven labelled steps, browser and server taking turns."},{type:"blank",q:"The server sends its ___ to the browser. The browser checks it is ___. The server then sends a digital ___ and an ___ session starts.",a:["digital certificate","authentic","acknowledgement","encrypted"],bank:["digital certificate","authentic","acknowledgement","encrypted","private key","password"],why:"Certificate, authentic, acknowledgement, encrypted."},{type:"mc",q:"A student drew arrows between the browser and the server but scored 0 out of 5. Why?",options:["None of the arrows had labels","There were too many arrows","The server was drawn on the right","It was drawn in pencil"],a:0,why:"Each mark is for a labelled step. An unlabelled arrow scores nothing."},{type:"type",q:"What does TLS stand for?",a:["transport layer security"],why:"Transport Layer Security, the newer version of SSL."}]},O1:{name:"Functions of an OS",ex:[{type:"teach",title:"What the OS does",text:'The operating system manages the hardware and lets you and your programs use the computer. Learn these exact names: vague answers like "runs the computer" score 0.',bullets:n},{type:"match",q:"Match each function to what it does",pairs:[["Managing memory","Allocates RAM to programs and data"],["Managing files","Creates, saves and deletes files and folders"],["Managing multitasking","Shares processor time between running programs"],["Providing an interface","Lets the user interact through a GUI or command line"],["Managing user accounts","Separate logins and access rights for each user"]]},{type:"match",q:"Match each function to what it does",pairs:[["Handling interrupts","Responds to signals that need the processor"],["Managing peripherals and drivers","Controls devices like printers through drivers"],["Providing system security","Passwords, firewalls and security updates"],["Providing a platform for running applications","Lets application software run on the hardware"]]},{type:"mc",q:"Which of these is NOT a function of an operating system?",options:["Translating high-level code into machine code","Managing memory","Handling interrupts","Managing user accounts"],a:0,why:"That is the job of a compiler or interpreter."},{type:"type",q:"Which OS function shares processor time between several running programs?",a:["managing multitasking","multitasking","manages multitasking"],why:"Managing multitasking."},{type:"mc",q:"Which OS function lets a printer work with the computer?",options:["Managing peripherals and drivers","Managing files","Providing an interface","Managing multitasking"],a:0,why:"Peripherals are controlled through driver software."},{type:"mc",q:'"State two functions of an operating system." Which answer scores?',options:["Managing memory and handling interrupts","Running the computer and doing tasks","Making the computer faster and safer","Opening apps and closing apps"],a:0,why:"Use the syllabus names. Vague phrases score 0."}]},O2:{name:"Interrupts and software types",ex:[{type:"teach",title:"Interrupts",text:"An interrupt is a signal from a device or a program that asks the processor for attention.",list:o},{type:"teach",title:"Hardware or software?",text:"Hardware interrupts come from devices: a key is pressed, the mouse is clicked, the printer runs out of paper. Software interrupts come from programs: division by zero, or two programs trying to use the same memory location."},{type:"mc",q:"Which is a software interrupt?",options:["A program tries to divide by zero","A key is pressed","The printer runs out of paper","The mouse is clicked"],a:0,why:"It comes from a program, not a device."},{type:"mc",q:"Which is a hardware interrupt?",options:["The printer runs out of paper","Division by zero","Two programs try to use the same memory location","A program asks for more memory"],a:0,why:"It comes from a device."},{type:"order",q:"Put the interrupt process in order",items:o,why:"Signal, check, save, ISR, restore."},{type:"type",q:"What does ISR stand for?",a:["interrupt service routine"],why:"The ISR is the code that handles the interrupt."},{type:"mc",q:"When does the processor check for interrupts?",options:["At the end of each fetch-decode-execute cycle","Only when the computer starts","Once every second","Only when a program crashes"],a:0,why:"It checks after every cycle."},{type:"teach",title:"Types of software",text:"System software runs the computer itself: the operating system and utility programs like anti-virus. Application software lets the user do tasks: word processors, browsers, games."},{type:"mc",q:"Which of these is system software?",options:["An anti-virus utility","A spreadsheet","A web browser","A photo editor"],a:0,why:"Utility programs are system software."}]},T1:{name:"Languages and translators",ex:[{type:"teach",title:"High and low level",text:"High-level languages, like Python or Java, are close to English, so they are easy to read, write and debug, and work on many types of computer. Low-level languages are assembly language and machine code. They are written for one type of processor and give direct control of the hardware."},{type:"teach",title:"Why translate?",text:"The CPU can only run machine code (binary). Every other language has to be translated first.",bullets:["Compiler: translates the whole high-level program into machine code in one go","Interpreter: translates and runs a high-level program one line at a time","Assembler: translates assembly language into machine code"]},{type:"match",q:"Match each translator to what it does",pairs:[["Compiler","Translates the whole program at once"],["Interpreter","Translates and runs one line at a time"],["Assembler","Translates assembly language into machine code"]]},{type:"type",q:"What translates assembly language into machine code?",a:["assembler","an assembler"],why:"Spell it out exactly: assembler."},{type:"mc",q:"Which language can the CPU run directly?",options:["Machine code","Assembly language","Python","Pseudocode"],a:0,why:"Everything else must be translated into machine code."},{type:"mc",q:"Give one reason programmers use high-level languages.",options:["They are easier to read, write and debug","The CPU runs them directly","They give direct control of the hardware","They only work on one type of processor"],a:0,why:"The other three describe low-level languages, or are false."},{type:"blank",q:"Assembly language is translated by an ___. Python is translated by a ___ or an ___.",a:["assembler","compiler","interpreter"],bank:["assembler","compiler","interpreter","editor","router"],why:"Assembler for assembly language. Compiler or interpreter for high-level languages."}]},T2:{name:"Compiler vs interpreter",ex:[{type:"teach",title:"Compiler",text:"Translates the whole program in one go and produces an executable file. Errors are reported together at the end. The executable runs without the compiler, so it can be shared without the source code."},{type:"teach",title:"Interpreter",text:"Translates and executes one line at a time. It stops at the first error, so errors are easy to find while you are writing code. It must be present every time the program runs."},{type:"mc",q:"Which produces an executable file?",options:["A compiler","An interpreter","A code editor","A run-time environment"],a:0,why:"Only the compiler produces an executable from high-level code."},{type:"mc",q:"Which is more useful while you are still writing and debugging a program?",options:["An interpreter, because it stops at the line with the error","A compiler, because it produces an executable","An assembler, because it uses machine code","Neither helps with errors"],a:0,why:"You see each error as soon as its line runs."},{type:"mc",q:"Which reports all of the errors after translating the whole program?",options:["A compiler","An interpreter","An assembler","The operating system"],a:0,why:"The compiler gives an error report at the end."},{type:"mc",q:"Which statement about interpreters is INCORRECT?",options:["It produces an executable file","It translates one line at a time","It stops when it finds an error","It must be present each time the program runs"],a:0,why:"Only a compiler produces an executable."},{type:"blank",q:"A ___ translates the whole program at once. An ___ translates one line at a time and stops at the first ___.",a:["compiler","interpreter","error"],bank:["compiler","interpreter","error","assembler","executable"],why:"Compiler: all at once. Interpreter: line by line."},{type:"type",q:"Which translator produces a file that can run without the translator being present?",a:["compiler","a compiler"],why:"A compiler. The executable runs on its own."}]},T3:{name:"The IDE",ex:[{type:"teach",title:"What is an IDE?",text:"An integrated development environment gives programmers the tools to write, translate, test and debug code in one place. Learn these features:",bullets:["Code editor","Run-time environment","Translator (compiler or interpreter)","Error diagnostics","Auto-completion","Auto-correction","Prettyprint"]},{type:"match",q:"Match each IDE feature to what it does",pairs:[["Auto-completion","Suggests how to finish a keyword or name as you type"],["Auto-correction","Fixes common typing mistakes automatically"],["Prettyprint","Colours keywords and indents code so it is easy to read"],["Error diagnostics","Highlights errors and explains them"]]},{type:"match",q:"Match each IDE feature to what it does",pairs:[["Code editor","Where you write and edit the code"],["Run-time environment","Runs and tests the program inside the IDE"],["Translator","Turns the code into machine code"]]},{type:"mc",q:"Which IDE feature colours keywords and indents code?",options:["Prettyprint","Auto-correction","Run-time environment","Error diagnostics"],a:0,why:"Prettyprint makes code easier to read."},{type:"type",q:"Name the IDE feature that suggests how to finish a word as you type.",a:["auto-completion","autocompletion","auto completion","autocomplete","auto-complete"],why:"Auto-completion."},{type:"mc",q:"Which of these is NOT a feature of an IDE?",options:["Managing multitasking","Auto-completion","Error diagnostics","Prettyprint"],a:0,why:"Managing multitasking is an operating system function."}]},P1:{name:"Pseudocode basics",ex:[{type:"teach",title:"Writing pseudocode",text:"Cambridge pseudocode uses fixed keywords in capitals, and ← for assignment. Using the right keywords is what earns the marks.",code:e("DECLARE Score : INTEGER","Score ← 0","INPUT Score",'OUTPUT "Your score is ", Score')},{type:"match",q:"Match each data type to an example",pairs:[["INTEGER","42"],["REAL","3.75"],["CHAR","'A'"],["STRING",'"Hello"'],["BOOLEAN","TRUE"]]},{type:"mc",q:"Which line correctly declares a variable?",options:["DECLARE Total : INTEGER","Total = INTEGER","INTEGER Total","DECLARE INTEGER Total"],a:0,mono:!0,why:"DECLARE, the name, a colon, then the type."},{type:"mc",q:"Which symbol is used for assignment?",options:["←","=","==",":="],a:0,mono:!0,why:'Total ← 0 means "Total becomes 0".'},{type:"blank",q:"DECLARE Names : ___[1:30] ___ STRING",a:["ARRAY","OF"],bank:["ARRAY","OF","LIST","TO","IS"],mono:!0,why:"DECLARE Names : ARRAY[1:30] OF STRING"},{type:"mc",q:"What is 17 MOD 5?",options:["2","3","3.4","12"],a:0,why:"MOD gives the remainder: 17 = 3 × 5 + 2."},{type:"mc",q:"What is 17 DIV 5?",options:["3","2","3.4","85"],a:0,why:"DIV gives the whole-number part of the division."},{type:"type",q:"Which keyword ends an IF statement?",a:["endif"],why:"IF … THEN … ELSE … ENDIF"}]},P2:{name:"Selection and loops",ex:[{type:"teach",title:"Selection",text:"IF checks a condition. CASE OF … OTHERWISE … ENDCASE chooses between several options.",code:e("IF Mark >= 50","  THEN",'    OUTPUT "Pass"',"  ELSE",'    OUTPUT "Fail"',"ENDIF")},{type:"teach",title:"Three loops",text:"Pick the loop that fits the problem:",bullets:["FOR … TO … NEXT: count-controlled, runs a set number of times","WHILE … DO … ENDWHILE: checks the condition first, so it might not run at all","REPEAT … UNTIL: checks the condition at the end, so it always runs at least once"]},{type:"mc",q:"Which loop always runs at least once?",options:["REPEAT … UNTIL","WHILE … DO … ENDWHILE","FOR … TO … NEXT","IF … THEN … ENDIF"],a:0,why:"The condition is checked at the end."},{type:"mc",q:"You need to repeat something exactly 10 times. Which loop?",options:["FOR … TO … NEXT","REPEAT … UNTIL","WHILE … DO … ENDWHILE","CASE OF … ENDCASE"],a:0,why:"A count-controlled loop."},{type:"blank",q:e("FOR Count ← 1 ___ 10","    OUTPUT Count","___ Count"),a:["TO","NEXT"],bank:["TO","NEXT","UNTIL","DO","ENDFOR"],mono:!0,why:"FOR … TO … NEXT"},{type:"blank",q:e("WHILE Number < 0 ___","    INPUT Number","___"),a:["DO","ENDWHILE"],bank:["DO","ENDWHILE","THEN","UNTIL","NEXT"],mono:!0,why:"WHILE … DO … ENDWHILE"},{type:"order",q:"Build this validation loop",items:["INPUT Age","WHILE Age < 0 OR Age > 120 DO",'    OUTPUT "Invalid, try again"',"    INPUT Age","ENDWHILE"],mono:!0,why:"Input once, then keep asking while the value is invalid."},{type:"mc",q:"Which keyword ends a CASE statement?",options:["ENDCASE","ENDIF","OTHERWISE","NEXT"],a:0,mono:!0,why:"CASE OF … OTHERWISE … ENDCASE"}]},A1:{name:"Totalling, counting, max",ex:[{type:"teach",title:"Totalling",text:"Set the total to 0 before the loop, and add to it inside the loop.",code:e("Total ← 0","FOR i ← 1 TO 10","    INPUT Num","    Total ← Total + Num","NEXT i")},{type:"teach",title:"Counting",text:"Set the count to 0 before the loop, and add 1 each time the condition is true.",code:e("Count ← 0","FOR i ← 1 TO 10","    INPUT Num","    IF Num > 50","      THEN","        Count ← Count + 1","    ENDIF","NEXT i")},{type:"teach",title:"Maximum",text:"Start with the first value, not 0. If every value was negative, 0 would wrongly end up as the maximum. Minimum works the same way with <.",code:e("Max ← Nums[1]","FOR i ← 2 TO 10","    IF Nums[i] > Max","      THEN","        Max ← Nums[i]","    ENDIF","NEXT i")},{type:"teach",title:"Average",text:"Work out the average after the loop has finished.",code:"Average ← Total / Count"},{type:"blank",q:"Total ← Total ___ Num",a:["+"],bank:["+","-","*","/"],mono:!0,why:"Add each value to the running total."},{type:"blank",q:"Count ← Count + ___",a:["1"],bank:["1","Num","0","Count"],mono:!0,why:"Counting always adds 1."},{type:"mc",q:"Where should Total ← 0 go?",options:["Before the loop","Inside the loop","After the loop","It isn't needed"],a:0,why:"Inside the loop it would reset every time."},{type:"mc",q:"Why set Max to the first value instead of 0?",options:["If all values are negative, 0 would wrongly be the maximum","0 is not a valid INTEGER","It makes the loop run faster","The first value is always the largest"],a:0,why:"Start from a real value in the list."},{type:"mc",q:"When should the average be calculated?",options:["After the loop","Before the loop","Inside the loop, every time","It can't be done in pseudocode"],a:0,why:"Divide once you have the full total."},{type:"order",q:"Build the counting algorithm",items:["Count ← 0","FOR i ← 1 TO 20","    INPUT Mark","    IF Mark >= 50","      THEN Count ← Count + 1","    ENDIF","NEXT i","OUTPUT Count"],mono:!0,why:"Initialise, loop, input, test, count, output after the loop."}]},A2:{name:"Linear search and bubble sort",ex:[{type:"teach",title:"Linear search",text:"Checks each item in turn, starting from the first, until the item is found or the end of the list is reached.",code:e("Found ← FALSE","i ← 1","WHILE Found = FALSE AND i <= 10 DO","    IF Names[i] = SearchName","      THEN","        Found ← TRUE","      ELSE","        i ← i + 1","    ENDIF","ENDWHILE")},{type:"teach",title:"Bubble sort",text:"Compares each pair of neighbouring items and swaps them if they are in the wrong order. It keeps making passes through the list until a pass makes no swaps. A swap needs a temporary variable.",code:e("Temp ← Nums[i]","Nums[i] ← Nums[i + 1]","Nums[i + 1] ← Temp")},{type:"mc",q:"A linear search looks for 7 in [3, 8, 7, 1]. How many comparisons does it make?",options:["3","1","2","4"],a:0,why:"3, then 8, then 7: found on the third comparison."},{type:"mc",q:"After one pass of a bubble sort (ascending) on [5, 1, 4, 2], what is the list?",options:["[1, 4, 2, 5]","[1, 2, 4, 5]","[1, 5, 4, 2]","[5, 4, 2, 1]"],a:0,mono:!0,why:"Swap 5 and 1, then 5 and 4, then 5 and 2. The largest value ends up last."},{type:"mc",q:"When does a bubble sort stop?",options:["When a full pass makes no swaps","After exactly one pass","When it finds the item","When the first item is the smallest"],a:0,why:"No swaps means the list is sorted."},{type:"order",q:"Put the bubble sort steps in order",items:["Compare the first two items","Swap them if they are in the wrong order","Move on to the next pair and repeat to the end of the list","Make another pass if any swaps were made"],why:"Compare, swap, move along, repeat passes."},{type:"blank",q:e("Temp ← Nums[i]","Nums[i] ← Nums[i + 1]","Nums[i + 1] ← ___"),a:["Temp"],bank:["Temp","Nums[i]","Nums[i + 1]","0"],mono:!0,why:"Without Temp, one of the values would be lost."},{type:"mc",q:"Why does the linear search use a flag like Found?",options:["To stop the loop once the item is found","To count the items","To sort the list","To store the item's position in memory"],a:0,why:"The loop stops as soon as Found becomes TRUE."}]},R1:{name:"Trace a FOR loop",ex:[{type:"teach",title:"Trace tables",text:"A trace table records the value of each variable as a program runs. Work through the code one line at a time and write down every change. Fill in each row in order."},{type:"trace",q:"Complete the trace table",code:e("Total ← 0","FOR Count ← 1 TO 4","    Total ← Total + Count","NEXT Count","OUTPUT Total"),cols:["Count","Total","OUTPUT"],rows:[["","0",""],["1","?1",""],["2","?3",""],["3","?6",""],["4","?10",""],["","","?10"]],why:"0 + 1 = 1, + 2 = 3, + 3 = 6, + 4 = 10."},{type:"mc",q:"What is output?",code:e("X ← 3","FOR i ← 1 TO 3","    X ← X * 2","NEXT i","OUTPUT X"),options:["24","6","12","48"],a:0,why:"3 → 6 → 12 → 24."},{type:"trace",q:"Nums holds 4, 7, 10, 3, 8. Complete the trace table.",code:e("Count ← 0","FOR i ← 1 TO 5","    IF Nums[i] MOD 2 = 0","      THEN","        Count ← Count + 1","    ENDIF","NEXT i","OUTPUT Count"),cols:["i","Nums[i]","Count","OUTPUT"],rows:[["","","0",""],["1","4","?1",""],["2","7","?1",""],["3","10","?2",""],["4","3","?2",""],["5","8","?3",""],["","","","?3"]],why:"Even numbers: 4, 10 and 8."},{type:"mc",q:"Nums holds 7, 3, 9, 4. What is Max at the end?",code:e("Max ← Nums[1]","FOR i ← 2 TO 4","    IF Nums[i] > Max","      THEN","        Max ← Nums[i]","    ENDIF","NEXT i"),options:["9","7","4","23"],a:0,why:"7, stays 7 for 3, becomes 9, stays 9 for 4."}]},R2:{name:"Trace WHILE and REPEAT",ex:[{type:"trace",q:"Complete the trace table",code:e("X ← 5","Y ← 0","WHILE X > 0 DO","    Y ← Y + X","    X ← X - 2","ENDWHILE","OUTPUT Y"),cols:["X","Y","OUTPUT"],rows:[["5","0",""],["3","?5",""],["?1","8",""],["-1","?9",""],["","","?9"]],why:"Y: 5, 8, 9. X: 3, 1, -1, then the loop stops."},{type:"mc",q:"What is output?",code:e("N ← 1","REPEAT","    N ← N * 2","UNTIL N > 20","OUTPUT N"),options:["32","16","20","64"],a:0,why:"2, 4, 8, 16, 32. Only 32 is greater than 20."},{type:"mc",q:"How many times does the loop body run?",code:e("N ← 10","WHILE N < 5 DO","    N ← N + 1","ENDWHILE"),options:["0","1","5","10"],a:0,why:"WHILE checks first. 10 < 5 is false, so it never runs."},{type:"mc",q:"How many times does the loop body run?",code:e("N ← 10","REPEAT","    N ← N + 1","UNTIL N > 5"),options:["1","0","5","11"],a:0,why:"REPEAT runs once before checking. N becomes 11, and 11 > 5, so it stops."},{type:"trace",q:"Complete the trace table",code:e("A ← 1","B ← 0","REPEAT","    B ← B + A","    A ← A + 2","UNTIL A > 7","OUTPUT B"),cols:["A","B","OUTPUT"],rows:[["1","0",""],["3","?1",""],["?5","4",""],["7","?9",""],["?9","16",""],["","","?16"]],why:"When A is 7, 7 > 7 is false, so the loop runs once more."}]},V1:{name:"Validation and test data",ex:[{type:"teach",title:"Validation",text:"Validation is an automatic check by the computer that data is sensible and allowed. It can't tell if the data is correct, only that it is reasonable.",bullets:["Range check","Length check","Type check","Presence check","Format check","Check digit"]},{type:"teach",title:"Verification",text:"Verification checks that data has been entered or copied accurately: double entry (typing it twice) or a visual check against the original."},{type:"match",q:"Match each check to what it tests",pairs:[["Range check","Value is between set limits"],["Length check","Has the right number of characters"],["Type check","Is the right data type"],["Presence check","Has not been left blank"],["Format check","Follows a pattern, like AB12 CDE"]]},{type:"mc",q:"Which check would stop an age of 150 being entered?",options:["Range check","Presence check","Length check","Check digit"],a:0,why:"150 is outside the allowed limits."},{type:"mc",q:"Typing a new password twice is an example of…",options:["Verification (double entry)","A range check","A type check","A check digit"],a:0,why:"It checks the two entries match."},{type:"teach",title:"Test data",text:"For a program that accepts whole numbers from 1 to 100:",bullets:["Normal: should be accepted, e.g. 50",'Abnormal: should be rejected, e.g. "abc" or 250',"Extreme: the largest and smallest acceptable values, 1 and 100","Boundary: values on each side of a limit, e.g. 100 (accepted) and 101 (rejected)"]},{type:"mc",q:"A program accepts 1 to 100. Which is extreme data?",options:["100","50","101",'"abc"'],a:0,why:"The largest acceptable value."},{type:"mc",q:"Which is abnormal data for the same program?",options:['"abc"',"1","50","100"],a:0,why:"It should be rejected."},{type:"mc",q:"Boundary data for the upper limit would be…",options:["100 and 101","50 and 51","1 and 100","0 and -1"],a:0,why:"The last accepted value and the first rejected one."}]}},i=["You type a URL into the web browser","The browser sends the domain name to a DNS server","The DNS server finds the matching IP address, asking other DNS servers if needed","The IP address is sent back to the browser","The browser sends a request to the web server at that IP address","The web server sends the web page back, and the browser renders it"],c=["Analysis: identify the problem and the requirements","Design: plan the solution with structure diagrams, flowcharts or pseudocode","Coding: write the program and test each part as you go","Testing: test the whole program with test data"],l=["A sensor measures a physical value","The data is converted from analogue to digital","The microprocessor compares the value with a stored value","If it is outside the range, the microprocessor signals an actuator","The actuator makes a change, and the process repeats"];Object.assign(r,{N1:{name:"Binary and denary",ex:[{type:"teach",title:"Why binary?",text:"Computers use binary (base 2) because their circuits have two states: on (1) and off (0). Each place value is double the one to its right.",code:e("128  64  32  16   8   4   2   1","  0   1   0   0   1   1   0   1","= 64 + 8 + 4 + 1 = 77")},{type:"teach",title:"Denary to binary",text:"Work from the left. If a place value fits into what is left, write 1 and subtract it. Otherwise write 0.",code:e("45 = 32 + 8 + 4 + 1","128  64  32  16   8   4   2   1","  0   0   1   0   1   1   0   1")},{type:"type",q:"Convert 00011010 to denary.",a:["26"],why:"16 + 8 + 2 = 26"},{type:"type",q:"Convert 10000001 to denary.",a:["129"],why:"128 + 1 = 129"},{type:"type",q:"Convert 37 to 8-bit binary.",a:["00100101","100101"],why:"37 = 32 + 4 + 1 = 00100101"},{type:"match",q:"Match each binary number to its denary value",monoLeft:!0,pairs:[["00000101","5"],["00001010","10"],["00010000","16"],["01100100","100"]]},{type:"mc",q:"What is the largest denary number 8 bits can hold?",options:["255","256","128","127"],a:0,why:"11111111 = 255. With 0 that makes 256 values."},{type:"mc",q:"Why do computers use binary?",options:["Their circuits have two states, on and off","It uses less electricity than denary","It is easier for people to read","It stores numbers more accurately"],a:0,why:"Every switch is either on (1) or off (0)."}]},N2:{name:"Hexadecimal",ex:[{type:"teach",title:"Hexadecimal",text:"Hex is base 16. It uses 0 to 9, then A to F for 10 to 15. One hex digit stands for exactly 4 bits (a nibble), so it is a short, easy-to-read way of writing binary."},{type:"teach",title:"Converting",text:"Binary to hex: split into groups of 4 bits and convert each group. Hex to denary: multiply the left digit by 16 and add the right digit.",code:e("1011 0110","  B    6   →  B6","B6 = 11 × 16 + 6 = 182")},{type:"mc",q:"What is hex F in denary?",options:["15","16","14","F is not a number"],a:0,why:"A = 10, B = 11, … F = 15."},{type:"type",q:"Convert hex 2A to denary.",a:["42"],why:"2 × 16 + 10 = 42"},{type:"type",q:"Convert 0011 1100 to hex.",a:["3c"],why:"0011 = 3, 1100 = 12 = C"},{type:"type",q:"Convert hex 7F to 8-bit binary.",a:["01111111","1111111"],why:"7 = 0111, F = 1111"},{type:"type",q:"Convert denary 200 to hex.",a:["c8"],why:"200 = 12 × 16 + 8, so C8."},{type:"match",q:"Match each hex number to its denary value",monoLeft:!0,pairs:[["A","10"],["10","16"],["1F","31"],["FF","255"]]},{type:"mc",q:"Where is hexadecimal used?",options:["MAC addresses, HTML colour codes and error codes","Storing sound samples","Compressing images","Encrypting passwords"],a:0,why:"Learn these three uses."},{type:"mc",q:"Why do programmers use hex instead of binary?",options:["It is shorter and easier to read, so fewer mistakes are made","Computers process hex faster","Hex uses less memory","Binary cannot store large numbers"],a:0,why:"The computer still stores it as binary."}]},N3:{name:"Addition, shifts and negatives",ex:[{type:"teach",title:"Binary addition",text:"0 + 0 = 0, 0 + 1 = 1, 1 + 1 = 10 (write 0, carry 1), 1 + 1 + 1 = 11 (write 1, carry 1).",code:e("  00101101   (45)","+ 00011011   (27)","  --------","  01001000   (72)")},{type:"teach",title:"Overflow",text:"8 bits can hold 0 to 255. If a result needs a 9th bit, overflow occurs. The extra bit is lost, so the stored answer is wrong."},{type:"type",q:"Add 00000110 + 00000011. Give the 8-bit answer.",a:["00001001","1001"],why:"6 + 3 = 9 = 00001001"},{type:"mc",q:"Which 8-bit addition causes overflow?",options:["11000000 + 01000000","01000000 + 00100000","00001111 + 00000001","10000000 + 00000001"],a:0,mono:!0,why:"192 + 64 = 256, which needs 9 bits."},{type:"teach",title:"Logical shifts",text:"A logical shift moves every bit left or right and fills the gap with 0. Each place left multiplies by 2; each place right divides by 2. Bits shifted off the end are lost.",code:e("00010110 (22)  shift left 1  →  00101100 (44)")},{type:"mc",q:"Shift 00001100 left by 2 places. The result is…",options:["00110000","00000011","00011000","11000000"],a:0,mono:!0,why:"12 × 4 = 48 = 00110000"},{type:"mc",q:"What does a logical right shift of 1 place do to the value?",options:["Divides it by 2","Multiplies it by 2","Makes it negative","Adds 1"],a:0,why:"Each place right halves the value."},{type:"teach",title:"Two's complement",text:"Two's complement stores negative numbers. The leftmost bit is worth -128 instead of +128. To make a negative number: write the positive value, flip every bit, then add 1.",code:e("+5   00000101","flip 11111010","+1   11111011  = -5")},{type:"type",q:"What denary value is 11111110 in two's complement?",a:["-2"],exact:!0,why:"-128 + 64 + 32 + 16 + 8 + 4 + 2 = -2"},{type:"mc",q:"What is -12 in 8-bit two's complement?",options:["11110100","10001100","11110011","00001100"],a:0,mono:!0,why:"12 = 00001100, flip = 11110011, add 1 = 11110100"},{type:"mc",q:"In 8-bit two's complement, what is the leftmost bit worth?",options:["-128","128","-1","256"],a:0,why:"That is what makes the number negative."}]},N4:{name:"Text, sound and images",ex:[{type:"teach",title:"Character sets",text:"Each character is stored as a binary code. ASCII uses 7 bits (or 8 in extended ASCII). Unicode uses more bits per character so it can represent every language and emoji, but text takes up more space."},{type:"teach",title:"Sound",text:"Sound is sampled: the amplitude of the wave is measured at set intervals. Sample rate is the number of samples per second. Sample resolution is the number of bits per sample. Higher values give better quality but bigger files."},{type:"teach",title:"Images",text:"A bitmap image is made of pixels. Resolution is the number of pixels (width × height). Colour depth is the number of bits per pixel. More of either gives better quality but a bigger file."},{type:"mc",q:"Why does Unicode need more storage than ASCII?",options:["It uses more bits per character, so it can represent more characters","It stores text as images","It adds error checking to every character","It only works with capital letters"],a:0,why:"More bits per character means more possible characters."},{type:"match",q:"Match each term to its meaning",pairs:[["Sample rate","Samples taken per second"],["Sample resolution","Bits used for each sample"],["Resolution","Number of pixels in the image"],["Colour depth","Bits used for each pixel"]]},{type:"mc",q:"An image has a colour depth of 8 bits. How many colours can it show?",options:["256","8","64","255"],a:0,why:"2⁸ = 256"},{type:"mc",q:"Increasing the sample rate will…",options:["Improve the quality and increase the file size","Improve the quality and reduce the file size","Reduce the quality","Change nothing"],a:0,why:"More samples per second means more data."},{type:"mc",q:"What is sample resolution?",options:["The number of bits used to store each sample","The number of samples per second","The length of the recording","The volume of the sound"],a:0,why:"Don't mix it up with sample rate."}]},N5:{name:"Storage units and compression",ex:[{type:"teach",title:"Units",text:"Cambridge uses binary units, each 1024 times the one before:",bullets:["1 nibble = 4 bits","1 byte = 8 bits","1 KiB = 1024 bytes","1 MiB = 1024 KiB","1 GiB = 1024 MiB","1 TiB = 1024 GiB (then PiB and EiB)"]},{type:"teach",title:"File sizes",text:"Work in bits, then divide by 8 for bytes and by 1024 for KiB.",code:e("Image = width × height × colour depth","Sound = sample rate × resolution × seconds")},{type:"mc",q:"How many bytes are in 1 KiB?",options:["1024","1000","8","1048"],a:0,why:"2¹⁰ = 1024"},{type:"mc",q:"An image is 100 × 50 pixels with a colour depth of 8 bits. What is its file size?",options:["5000 bytes","40 000 bytes","400 bytes","5 KiB"],a:0,why:"100 × 50 × 8 = 40 000 bits, ÷ 8 = 5000 bytes"},{type:"mc",q:"A sound is sampled at 1000 Hz with 16-bit resolution for 10 seconds. What is its size?",options:["20 000 bytes","160 000 bytes","2000 bytes","16 000 bytes"],a:0,why:"1000 × 16 × 10 = 160 000 bits, ÷ 8 = 20 000 bytes"},{type:"teach",title:"Compression",text:"Compression makes files smaller, so they use less storage and bandwidth and transfer faster. Lossy compression permanently removes data you are unlikely to notice (e.g. MP3, JPEG). Lossless compression loses nothing, so the original can be rebuilt exactly, e.g. run length encoding (RLE)."},{type:"match",q:"Match each term to its meaning",pairs:[["Lossy","Permanently removes some data"],["Lossless","Original can be restored exactly"],["RLE","Stores a repeated value once with a count"],["MP3","A lossy audio format"]]},{type:"mc",q:"Which compression should be used for a text file or a program?",options:["Lossless, because every bit matters","Lossy, because it makes the file smallest","Either, it makes no difference","Neither, text cannot be compressed"],a:0,why:"Losing data would change the text or break the program."},{type:"type",q:"Name a lossless compression method.",a:["run length encoding","rle","run-length encoding"],why:"Run length encoding (RLE)."}]},D1:{name:"Packets and transmission",ex:[{type:"teach",title:"Packets",text:"Data is split into packets to travel across a network. Each packet has three parts:",bullets:["Header: the destination IP address, source IP address and packet number","Payload: the actual data","Trailer: an error check and an end-of-packet marker"]},{type:"teach",title:"Packet switching",text:"Each packet can take a different route, chosen by routers. Packets may arrive out of order, so they are put back in order using their packet numbers."},{type:"match",q:"Match each part of a packet to what it holds",pairs:[["Header","Addresses and the packet number"],["Payload","The actual data"],["Trailer","Error check and end marker"]]},{type:"mc",q:"Why does each packet need a packet number?",options:["So the packets can be put back in the right order","So the router knows the fastest route","So the data is encrypted","So the packet can be deleted later"],a:0,why:"Packets can arrive out of order."},{type:"teach",title:"Serial and parallel",text:"Serial sends one bit at a time down one wire. Parallel sends several bits at once down several wires. Parallel is faster over short distances, but over long distances the bits can arrive out of sync (skew), so serial is more reliable."},{type:"teach",title:"Direction of data",text:"Learn the three modes:",bullets:["Simplex: one direction only, e.g. computer to printer","Half-duplex: both directions, but one at a time, e.g. a walkie-talkie","Full-duplex: both directions at the same time, e.g. a phone call"]},{type:"mc",q:"Which mode sends data both ways, but only one way at a time?",options:["Half-duplex","Simplex","Full-duplex","Parallel"],a:0,why:"Like a walkie-talkie."},{type:"mc",q:"Why is serial better than parallel over long distances?",options:["The bits can't arrive out of sync (no skew)","It sends more bits at once","It doesn't need any wires","It is always faster"],a:0,why:"Parallel bits can drift out of sync over long cables."},{type:"teach",title:"USB",text:"Universal Serial Bus is a standard serial connection. Devices are recognised automatically and the right driver is loaded, the plug only fits one way, and it supplies power. Drawbacks: limited cable length and lower speed than some connections."},{type:"mc",q:"Which is a benefit of USB?",options:["Devices are detected automatically and the driver is loaded","Cables can be any length","It sends bits in parallel","It never needs drivers"],a:0,why:"Plug in and it works."}]},D2:{name:"Error detection",ex:[{type:"teach",title:"Parity checks",text:"Interference can flip bits during transmission. A parity bit makes the number of 1s even (even parity) or odd (odd parity). If the count is wrong when the data arrives, there is an error. A parity block can show which bit is wrong, but two flipped bits can go unnoticed."},{type:"mc",q:"Using even parity, what should the parity bit be for 1011001?",options:["0","1"],a:0,mono:!0,why:"There are four 1s already, which is even."},{type:"mc",q:"A byte arrives as 11010110 using odd parity. Is there an error?",options:["No, it has five 1s, which is odd","Yes, it has an even number of 1s","Yes, the first bit should be 0","It can't be checked"],a:0,mono:!1,why:"Count the 1s: 5."},{type:"teach",title:"Checksum and echo check",text:"Checksum: a value is calculated from the data and sent with it. The receiver recalculates it, and if the two values differ there is an error. Echo check: the receiver sends the data back and the sender compares it with the original."},{type:"teach",title:"Check digits and ARQ",text:"A check digit is calculated from the other digits and added to the end of a number, like a barcode or ISBN, to catch typing mistakes. ARQ (automatic repeat request) uses acknowledgements and timeouts: if no acknowledgement arrives in time, the data is sent again."},{type:"match",q:"Match each method to how it works",pairs:[["Parity check","The number of 1s must be even or odd"],["Checksum","A value is recalculated from the data"],["Echo check","Data is sent back to the sender"],["ARQ","Resends if no acknowledgement arrives"],["Check digit","Extra digit calculated from the others"]]},{type:"type",q:"What does ARQ stand for?",a:["automatic repeat request","automatic repeat query"],why:"Automatic Repeat reQuest."},{type:"mc",q:"Which check catches a mistake when a barcode number is typed in?",options:["Check digit","Echo check","ARQ","Parity block"],a:0,why:"Check digits catch input errors."},{type:"mc",q:"What is a drawback of the echo check?",options:["If the data is corrupted on the way back, you can't tell which copy was wrong","It needs a parity bit","It can only check numbers","It encrypts the data"],a:0,why:"The error could have happened on either journey."}]},C1:{name:"CPU performance and embedded systems",ex:[{type:"teach",title:"What makes a CPU faster",text:"Three factors affect performance:",bullets:["Clock speed: the number of FDE cycles per second, measured in GHz","Cores: each core processes instructions independently, so more cores can do more at once","Cache: small, very fast memory in the CPU that stores frequently used instructions and data"]},{type:"teach",title:"Instruction set",text:"The instruction set is the list of all the commands, in machine code, that a CPU can process."},{type:"teach",title:"Embedded systems",text:"An embedded system is a computer built into a larger device to do one dedicated task, like the controller in a washing machine, microwave or car engine. They are small, cheap and use little power, but are hard to upgrade."},{type:"match",q:"Match each term to its meaning",pairs:[["Clock speed","FDE cycles per second"],["Core","An independent processing unit"],["Cache","Fast memory for frequently used data"],["Instruction set","Commands the CPU can process"]]},{type:"mc",q:"Why might doubling the number of cores not double the speed?",options:["Not every program can split its work between cores","Cores slow each other's clock down","Cache gets smaller with more cores","The extra cores are only for graphics"],a:0,why:"Some tasks have to be done in order."},{type:"mc",q:"How does cache improve performance?",options:["Frequently used data doesn't have to be fetched from RAM","It increases the clock speed","It adds more cores","It stores files permanently"],a:0,why:"Cache is much faster to access than RAM."},{type:"mc",q:"Which of these is an embedded system?",options:["The controller inside a washing machine","A laptop","A desktop PC","A web server"],a:0,why:"One dedicated task inside a bigger device."}]},H1:{name:"Input and output devices",ex:[{type:"teach",title:"Input devices",text:"Know how these work and where they are used:",bullets:["Barcode and QR code scanners","Digital cameras","Keyboards and optical mice","Microphones","Touch screens: resistive, capacitive and infra-red","2D and 3D scanners"]},{type:"teach",title:"Output devices",text:"And these:",bullets:["Actuators","DLP and LCD projectors","Inkjet, laser and 3D printers","LED and LCD screens","Speakers"]},{type:"teach",title:"Sensors",text:"A sensor measures a physical property and sends the data to a microprocessor. Types include acoustic, accelerometer, flow, gas, humidity, infra-red, level, light, magnetic field, moisture, pH, pressure, proximity and temperature."},{type:"mc",q:"Which sensor would control a greenhouse watering system?",options:["Moisture","Acoustic","Accelerometer","Proximity"],a:0,why:"It measures how wet the soil is."},{type:"match",q:"Match each sensor to a use",pairs:[["Temperature","Central heating"],["Light","Automatic street lights"],["pH","Monitoring a fish tank"],["Accelerometer","Detecting a phone being rotated"]]},{type:"mc",q:"Which of these is an output device?",options:["Actuator","Microphone","Barcode scanner","Sensor"],a:0,why:"An actuator causes a physical movement."},{type:"mc",q:"Which touch screen detects a change in the electric field when a finger touches it?",options:["Capacitive","Resistive","Infra-red","Optical"],a:0,why:"Capacitive screens use the charge in your finger."},{type:"mc",q:"Which printer builds a solid object layer by layer?",options:["3D printer","Laser printer","Inkjet printer","DLP projector"],a:0,why:"Additive manufacturing."}]},H2:{name:"Primary and secondary storage",ex:[{type:"teach",title:"Primary storage",text:"Primary storage is accessed directly by the CPU. RAM is volatile (it loses its data when the power is off) and holds the programs and data in use. ROM is non-volatile and read-only, and holds the start-up instructions."},{type:"teach",title:"Secondary storage",text:"Non-volatile storage for files and programs that are not in use:",bullets:["Magnetic (hard disk drive): read/write heads and spinning platters","Optical (CD, DVD, Blu-ray): a laser reads pits and lands","Solid state (SSD, USB flash drive): flash memory, no moving parts"]},{type:"teach",title:"Virtual memory and the cloud",text:"Virtual memory: when RAM is full, part of secondary storage is used as extra RAM, and pages of data are swapped in and out. Cloud storage: data is kept on remote servers and accessed over the internet."},{type:"match",q:"Match each type of storage to its description",pairs:[["RAM","Volatile, holds data in use"],["ROM","Non-volatile, holds start-up instructions"],["HDD","Magnetic, spinning platters"],["SSD","Flash memory, no moving parts"],["DVD","Optical, read by a laser"]]},{type:"mc",q:"Why is RAM described as volatile?",options:["It loses its contents when the power is turned off","It can only be read, not written","It is outside the CPU","It is very fast"],a:0,why:"Volatile = data lost without power."},{type:"mc",q:"When is virtual memory used?",options:["When RAM is full","When the hard drive is full","When the computer starts up","When the internet is slow"],a:0,why:"Secondary storage acts as extra RAM."},{type:"mc",q:"Which is a drawback of cloud storage?",options:["You need an internet connection to access your files","Files can only be opened on one device","It has no backups","It is always slower than a USB drive"],a:0,why:"No connection, no files."}]},H3:{name:"Network hardware",ex:[{type:"teach",title:"NIC and MAC address",text:"A network interface card (NIC) lets a device connect to a network. It has a MAC address: a unique 48-bit address set by the manufacturer, usually written as 12 hex digits. The first half identifies the manufacturer, the second half the device."},{type:"teach",title:"IP addresses",text:"An IP address identifies a device on a network and is given to it when it connects. IPv4 is 32 bits, written as four numbers from 0 to 255, like 192.168.0.1. IPv6 is 128 bits, written in hex. A static IP address never changes; a dynamic one is assigned each time the device connects."},{type:"teach",title:"Routers",text:"A router sends data packets to their destination on other networks using IP addresses. A home router connects your local network to the internet and gives devices their IP addresses."},{type:"match",q:"Match each term to its description",pairs:[["MAC address","Unique, set by the manufacturer"],["IP address","Assigned when joining a network"],["IPv4","32 bits"],["IPv6","128 bits"]]},{type:"mc",q:"Which is a valid IPv4 address?",options:["192.168.1.20","192.168.1.300","192.168.1","A1:B2:C3:D4:E5:F6"],a:0,mono:!0,why:"Four numbers, each 0 to 255."},{type:"mc",q:"How many bits are in a MAC address?",options:["48","32","128","64"],a:0,why:"Written as 12 hex digits."},{type:"mc",q:"What is the difference between a static and a dynamic IP address?",options:["Static never changes; dynamic is assigned each time the device connects","Static is for phones; dynamic is for laptops","Static is IPv6; dynamic is IPv4","Static is set by the manufacturer"],a:0,why:"The MAC address is the one set by the manufacturer."},{type:"mc",q:"Which device forwards packets between networks using IP addresses?",options:["A router","A NIC","A switch inside the CPU","A web browser"],a:0,why:"Routers connect networks."}]},W1:{name:"The internet and the web",ex:[{type:"teach",title:"Internet vs web",text:"The internet is the infrastructure: a global network of connected networks. The world wide web is the collection of websites and web pages that you access using the internet."},{type:"teach",title:"URLs",text:"A URL is the text address of a web page. It has three parts:",code:e("https  ://  www.example.com  /news/today.html","protocol     domain name      web page / file name")},{type:"teach",title:"Finding a web page",text:"This is how DNS turns a URL into a web page:",list:i},{type:"order",q:"Put the DNS process in order",items:i,why:"URL, DNS lookup, IP back, request, page returned."},{type:"match",q:"Match each part of the URL to its name",monoLeft:!0,pairs:[["https","Protocol"],["www.example.com","Domain name"],["/news/today.html","Web page or file name"]]},{type:"mc",q:"What does a DNS server do?",options:["Finds the IP address that matches a domain name","Stores every web page","Encrypts data sent to websites","Assigns MAC addresses"],a:0,why:"Domain name in, IP address out."},{type:"teach",title:"HTTP, HTTPS and cookies",text:"HTTP is the protocol used to send web pages. HTTPS is the secure version, using SSL/TLS. Cookies are small text files a website stores in your browser: session cookies are deleted when the browser closes, persistent cookies stay to remember things like logins."},{type:"mc",q:"What is the difference between session and persistent cookies?",options:["Session cookies are deleted when the browser closes; persistent ones are kept","Session cookies are encrypted; persistent ones are not","Persistent cookies are viruses","There is no difference"],a:0,why:"Persistent cookies remember you next time."},{type:"teach",title:"Digital currency",text:"Digital currency only exists electronically. Blockchain is a decentralised digital ledger: each transaction is stored in a time-stamped block linked to the one before, so records can't be changed without it being noticed."},{type:"mc",q:"What is blockchain?",options:["A decentralised ledger of time-stamped, linked transactions","A type of encryption key","A secure web browser","A firewall for banks"],a:0,why:"Every block links to the previous one."},{type:"mc",q:"Which is a function of a web browser?",options:["Rendering HTML to display web pages","Assigning IP addresses","Translating domain names into IP addresses","Storing websites for other users"],a:0,why:"Browsers also store bookmarks, history and cookies, and allow tabs."}]},CS1:{name:"Cyber security threats",ex:[{type:"teach",title:"Threats, part 1",text:"Learn each threat and what it does:",bullets:["Brute-force attack: trying every possible password until one works","Data interception: data is captured as it travels, e.g. with a packet sniffer","DDoS (distributed denial of service): many computers flood a server with requests so real users can't access it","Hacking: gaining unauthorised access to a computer system"]},{type:"teach",title:"Threats, part 2",text:"And these:",bullets:["Phishing: fake emails that trick people into giving personal details","Pharming: malicious code redirects users to a fake website without them knowing","Social engineering: manipulating people into giving away information or access","Malware: harmful software"]},{type:"teach",title:"Types of malware",text:"Know the differences:",bullets:["Virus: copies itself and needs a host program","Worm: copies itself and spreads across a network on its own","Trojan horse: hidden inside software that looks legitimate","Spyware: records what you do, e.g. keystrokes, and sends it on","Adware: shows unwanted adverts","Ransomware: encrypts your files and demands payment"]},{type:"match",q:"Match each threat to its description",pairs:[["Brute-force attack","Tries every possible password"],["DDoS","Floods a server with requests"],["Phishing","Fake email asking for details"],["Pharming","Redirects you to a fake website"],["Spyware","Records keystrokes and sends them on"]]},{type:"mc",q:"What is the difference between phishing and pharming?",options:["Phishing uses a fake email; pharming uses code that redirects you to a fake site","Phishing is malware; pharming is a brute-force attack","Pharming needs the user to click a link; phishing doesn't","They are the same thing"],a:0,why:"With pharming you can type the correct URL and still end up on the fake site."},{type:"mc",q:"Which malware encrypts your files and demands payment?",options:["Ransomware","Adware","Worm","Spyware"],a:0,why:"Pay the ransom for the key."},{type:"mc",q:"How is a worm different from a virus?",options:["A worm spreads across a network on its own; a virus needs a host program","A worm only shows adverts","A virus can't copy itself","A worm is not malware"],a:0,why:"Worms are standalone."}]},CS2:{name:"Keeping data safe",ex:[{type:"teach",title:"Protecting a system",text:"Match each solution to the threat it stops:",bullets:["Access levels: users only see the data they need","Anti-malware: scans for, quarantines and removes malware","Authentication: passwords, biometrics and two-step verification","Automatic software updates: patch security weaknesses","Checking spelling, tone and link addresses: spots phishing","Firewalls: monitor traffic and block anything that breaks set rules","Privacy settings: control who can see your data","Proxy servers: sit between you and the internet, hiding your IP and filtering traffic","SSL: encrypts data between browser and server"]},{type:"match",q:"Match each solution to what it does",pairs:[["Firewall","Blocks traffic that breaks set rules"],["Proxy server","Hides the user's IP and filters traffic"],["Two-step verification","A code sent to your phone as a second check"],["Access levels","Users only see the data they need"]]},{type:"mc",q:"Which would best help a user spot a phishing email?",options:["Checking the spelling, tone and real address of any links","Turning on a firewall","Using a proxy server","Defragmenting the hard drive"],a:0,why:"Phishing emails often have errors and fake links."},{type:"mc",q:"Why should software be updated automatically?",options:["Updates patch weaknesses that hackers could exploit","Updates make files smaller","Updates encrypt your data","Updates remove the need for passwords"],a:0,why:"Unpatched software is an easy target."},{type:"mc",q:"Which is biometric authentication?",options:["A fingerprint scan","A 6-digit PIN","A security question","A code sent by text"],a:0,why:"Biometrics use a part of your body."},{type:"mc",q:"Which solution would best protect against a brute-force attack?",options:["Strong passwords and locking the account after several failed attempts","A proxy server","Privacy settings","Checking the spelling of emails"],a:0,why:"Limit the guesses an attacker can make."}]},AU1:{name:"Automated systems and robotics",ex:[{type:"teach",title:"Automated systems",text:"Automated systems use sensors, a microprocessor and actuators to control a process with no human input:",list:l},{type:"order",q:"Put the automated system steps in order",items:l,why:"Sense, convert, compare, signal, act, repeat."},{type:"mc",q:"What does an actuator do in an automated system?",options:["Carries out a physical action, like opening a valve or turning a motor","Measures a physical value","Compares readings with stored values","Converts analogue to digital"],a:0,why:"Sensors measure, actuators act."},{type:"teach",title:"Robotics",text:"A robot has a mechanical structure, electrical components (sensors, microprocessors, actuators) and is programmable. Robots are used in factories, homes, medicine, agriculture and transport. They can work non-stop and in dangerous places, but are expensive and can replace jobs."},{type:"mc",q:"Which is a characteristic of a robot?",options:["It is programmable","It must look like a human","It must be connected to the internet","It can only work in factories"],a:0,why:"Mechanical structure, electrical components, programmable."},{type:"mc",q:"Which is a disadvantage of using robots in a factory?",options:["They are expensive to buy and maintain","They need breaks","They make more mistakes than people","They can't work in dangerous places"],a:0,why:"High set-up and maintenance costs."}]},AI1:{name:"Artificial intelligence",ex:[{type:"teach",title:"What is AI?",text:"Artificial intelligence is when a computer simulates intelligent human behaviour. It collects data, applies rules and reasons to make decisions, and can learn and adapt."},{type:"teach",title:"Expert systems",text:"An expert system gives expert-level advice, like a medical diagnosis or finding a car fault. It has four parts:",bullets:["Knowledge base: the facts","Rule base: the rules","Inference engine: applies the rules to the facts to reach a conclusion","Interface: asks the user questions and shows the results"]},{type:"teach",title:"Machine learning",text:"Machine learning is when a program automatically adapts its own processes and data, improving through experience without being reprogrammed."},{type:"match",q:"Match each part of an expert system to its job",pairs:[["Knowledge base","Stores the facts"],["Rule base","Stores the rules"],["Inference engine","Applies the rules to the facts"],["Interface","Asks questions and shows results"]]},{type:"type",q:"A system can automatically adapt its own processes and data. What is this ability called?",a:["machine learning"],why:"Machine learning."},{type:"mc",q:"Which part of an expert system reaches a conclusion?",options:["The inference engine","The knowledge base","The interface","The rule base"],a:0,why:"It reasons with the facts and rules."},{type:"mc",q:"Which is an example of AI?",options:["A chatbot that answers customer questions","A calculator adding two numbers","A spreadsheet totalling a column","A printer queue"],a:0,why:"It reasons about what the user means."}]},PD1:{name:"Program development",ex:[{type:"teach",title:"The program development life cycle",text:"Programs are developed in four stages:",list:c},{type:"teach",title:"Decomposition and abstraction",text:"Decomposition breaks a problem into smaller sub-problems. Every system can be broken into inputs, processes, outputs and storage. Abstraction removes details that don't matter. A structure diagram shows how a system is broken down."},{type:"teach",title:"Flowchart symbols",text:"Learn the shapes:",bullets:["Terminator (rounded rectangle): START and STOP","Process (rectangle): a calculation or assignment","Input/output (parallelogram): INPUT or OUTPUT","Decision (diamond): a yes/no question","Subroutine (rectangle with double sides): calls another routine","Flow lines (arrows): the order of steps"]},{type:"order",q:"Put the program development life cycle in order",items:c,why:"Analysis, design, coding, testing."},{type:"match",q:"Match each flowchart symbol to its shape",pairs:[["Terminator","Rounded rectangle"],["Process","Rectangle"],["Input/output","Parallelogram"],["Decision","Diamond"]]},{type:"mc",q:"What is decomposition?",options:["Breaking a problem into smaller sub-problems","Removing unnecessary detail","Testing each part of a program","Writing pseudocode"],a:0,why:"Removing detail is abstraction."},{type:"mc",q:"What is a structure diagram used for?",options:["Showing how a system is broken down into sub-systems","Showing the order of steps with decisions","Recording variable values","Drawing logic circuits"],a:0,why:"Flowcharts show order and decisions."}]},PR1:{name:"Strings, procedures and functions",ex:[{type:"teach",title:"String handling",text:"Positions start at 1.",code:e('LENGTH("Hello")             → 5','UCASE("hello")              → "HELLO"','LCASE("HeLLo")              → "hello"','SUBSTRING("Computer", 1, 4) → "Comp"')},{type:"teach",title:"Procedures and functions",text:"Both are named blocks of code you can call. A function returns a value; a procedure doesn't. Parameters pass values in. Local variables only exist inside the routine; global variables can be used anywhere.",code:e("FUNCTION Square(Num : INTEGER) RETURNS INTEGER","    RETURN Num * Num","ENDFUNCTION","","PROCEDURE Greet(Name : STRING)",'    OUTPUT "Hello ", Name',"ENDPROCEDURE")},{type:"teach",title:"Library routines",text:"Built-in routines you can use:",code:e("17 MOD 5             → 2","17 DIV 5             → 3","ROUND(3.14159, 2)    → 3.14","RANDOM()             → a random number from 0 to 1")},{type:"mc",q:'What does SUBSTRING("Computer", 4, 3) return?',options:['"put"','"pute"','"mpu"','"Com"'],a:0,mono:!0,why:"Start at position 4 (p) and take 3 characters."},{type:"mc",q:'What does LENGTH("IGCSE") return?',options:["5","4","6",'"IGCSE"'],a:0,why:"5 characters."},{type:"mc",q:"What is the main difference between a function and a procedure?",options:["A function returns a value","A procedure can have parameters","A function can't use variables","A procedure runs faster"],a:0,why:"Functions RETURN a value."},{type:"blank",q:e("FUNCTION Double(N : INTEGER) ___ INTEGER","    ___ N * 2","ENDFUNCTION"),a:["RETURNS","RETURN"],bank:["RETURNS","RETURN","OUTPUT","TO"],mono:!0,why:"RETURNS in the header, RETURN in the body."},{type:"mc",q:"Where can a local variable be used?",options:["Only inside the routine where it is declared","Anywhere in the program","Only in the main program","Only in functions"],a:0,why:"Global variables can be used anywhere."},{type:"type",q:"What is ROUND(7.468, 1)?",a:["7.5"],exact:!0,why:"Round to 1 decimal place."},{type:"mc",q:"Which makes a program easier to maintain?",options:["Meaningful names, comments and using procedures and functions","Using single-letter variable names","Writing everything in one long block","Avoiding comments to keep it short"],a:0,why:"Other programmers need to understand it."}]},PR2:{name:"Arrays and files",ex:[{type:"teach",title:"Arrays",text:"An array stores several values of the same data type under one name. Each value has an index, which usually starts at 1.",code:e("DECLARE Scores : ARRAY[1:5] OF INTEGER","Scores[3] ← 70")},{type:"teach",title:"2D arrays",text:"A 2D array is like a table. The first index is the row, the second is the column.",code:e("DECLARE Grid : ARRAY[1:3, 1:4] OF CHAR","Grid[2, 4] ← 'X'")},{type:"mc",q:"Names is declared as ARRAY[1:30] OF STRING. How many items can it store?",options:["30","29","31","1"],a:0,why:"Indexes 1 to 30."},{type:"mc",q:"What does Grid[2, 4] refer to?",options:["Row 2, column 4","Row 4, column 2","The 8th item","Items 2 to 4"],a:0,why:"Row first, then column."},{type:"order",q:"Build the code to total an array",items:["Total ← 0","FOR i ← 1 TO 10","    Total ← Total + Scores[i]","NEXT i","OUTPUT Total"],mono:!0,why:"Loop through every index."},{type:"teach",title:"Files",text:"Data in a file is kept after the program closes.",code:e('OPENFILE "Scores.txt" FOR WRITE','WRITEFILE "Scores.txt", Score','CLOSEFILE "Scores.txt"',"",'OPENFILE "Scores.txt" FOR READ','READFILE "Scores.txt", Line','CLOSEFILE "Scores.txt"')},{type:"blank",q:e('OPENFILE "Data.txt" FOR ___','READFILE "Data.txt", Line','___ "Data.txt"'),a:["READ","CLOSEFILE"],bank:["READ","WRITE","CLOSEFILE","ENDFILE","OPEN"],mono:!0,why:"Open for READ, then always close the file."},{type:"mc",q:"Why store data in a file?",options:["So it is kept permanently after the program closes","So the program runs faster","So it uses less RAM while running","So it is encrypted"],a:0,why:"Variables are lost when the program ends."}]},DB1:{name:"Databases and SQL",ex:[{type:"teach",title:"Database terms",text:"A table stores data about one type of thing. Each row is a record and each column is a field. The primary key is a field that uniquely identifies each record. Field data types include text, character, Boolean, integer, real and date/time."},{type:"match",q:"Match each term to its meaning",pairs:[["Record","One row of the table"],["Field","One column of the table"],["Primary key","Uniquely identifies each record"],["Table","Data about one type of thing"]]},{type:"mc",q:"Which field is best as the primary key in a Students table?",options:["StudentID","Surn
